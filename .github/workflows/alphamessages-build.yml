name: Build AlphaMessages
on:
  push:
    paths:
      - 'AlphaMessages/**'
      - '.github/workflows/alphamessages-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build AlphaMessages
        run: mvn -B -U -f AlphaMessages/pom.xml clean package
      - uses: actions/upload-artifact@v4
        with:
          name: AlphaMessages-JAR
          path: AlphaMessages/target/AlphaMessages.jar
